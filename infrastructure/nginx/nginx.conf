# Production reverse proxy (TLS terminated here or by your platform).
# - /api/*                         -> FastAPI (same origin as the dashboard, so cookies stay first-party)
# - /api/v1/campaigns/*/events     -> FastAPI SSE with buffering disabled
# - /telegram/webhook              -> Telegram bot webhook (secret token validated by the bot)
# - everything else                -> Next.js
upstream api      { server api:8000; }
upstream web      { server frontend:3000; }
upstream telegram { server telegram:8081; }

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Enable once served over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location ~ ^/api/v1/campaigns/[0-9a-f-]+/events$ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The edge proxy: replace, never append, so a client-sent X-Forwarded-For cannot pick the IP the API sees.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    # The edge proxy: replace, never append, so a client-sent X-Forwarded-For cannot pick the IP the API sees.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /telegram/webhook {
    proxy_pass http://telegram;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    # The edge proxy: replace, never append, so a client-sent X-Forwarded-For cannot pick the IP the API sees.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
